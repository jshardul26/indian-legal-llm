# =========================================================
# Indian Legal LLM — Central Configuration
# Change values here, never hardcode them in Python source.
# =========================================================

model:
  base_model_id: "Qwen/Qwen2.5-1.5B-Instruct"   # ~1.5B params, fits 6GB VRAM in 4-bit
  load_in_4bit: true
  device_map: "auto"

dataset:
  name: "viber1/indian-law-dataset"   # 24.6k rows, Instruction/Response columns
  raw_cache_dir: "data/raw"
  preprocessing_cache_dir: "data/processed"
  validation_split: 0.1
  max_samples: 12000        # subset for a ~2-3hr fine-tune on RTX 4050; set null for full dataset

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

training:
  output_dir: "outputs/adapters/legal-qlora-v1"
  num_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4     # effective batch size = 8
  learning_rate: 0.0002
  warmup_steps: 50
  weight_decay: 0.01
  max_seq_length: 512
  save_steps: 100
  eval_steps: 100
  logging_steps: 20
  seed: 42

evaluation:
  eval_output_dir: "outputs/evaluations"

generation:
  temperature: 0.7
  max_new_tokens: 512
  top_p: 0.9
